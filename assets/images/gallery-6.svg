<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="g6Sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1236"/>
      <stop offset="40%" stop-color="#5E2355"/>
      <stop offset="75%" stop-color="#A84378"/>
      <stop offset="100%" stop-color="#F8C8DC"/>
    </linearGradient>
    <radialGradient id="g6Moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFF6DE"/>
      <stop offset="100%" stop-color="#F7E7B4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g6Sakura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FFD1DC"/>
      <stop offset="80%" stop-color="#FF85A2"/>
      <stop offset="100%" stop-color="#E75480"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#g6Sky)" rx="32"/>
  <rect x="24" y="24" width="752" height="952" rx="24" fill="none" stroke="#FFD1DC" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 6"/>

  <!-- Glowing Luminous Full Moon -->
  <circle cx="620" cy="280" r="110" fill="url(#g6Moon)"/>
  <circle cx="620" cy="280" r="75" fill="#FFFDF5" opacity="0.95"/>

  <!-- Rolling Twilight Hills & Garden Floor -->
  <path d="M 0 760 Q 250 720 500 750 T 800 730 L 800 1000 L 0 1000 Z" fill="#240A28"/>
  <path d="M 0 810 Q 300 780 600 810 T 800 800 L 800 1000 L 0 1000 Z" fill="#140417"/>

  <!-- Majestic Sprawling Cherry Blossom Tree (Trunk & Branches) -->
  <g stroke="#3D182B" stroke-linecap="round" fill="none">
    <!-- Main Trunk -->
    <path d="M 160 850 C 170 700, 200 580, 260 480 C 280 440, 320 400, 380 360" stroke-width="36"/>
    <path d="M 160 850 C 130 900, 80 960, 40 1000" stroke-width="24"/>
    <path d="M 180 850 C 220 900, 250 960, 280 1000" stroke-width="20"/>

    <!-- Left Canopy Branch -->
    <path d="M 260 480 C 180 440, 120 400, 60 380" stroke-width="18"/>
    <path d="M 180 440 C 160 360, 120 320, 80 290" stroke-width="12"/>

    <!-- Right Spreading Canopy Branches -->
    <path d="M 380 360 C 460 340, 560 320, 680 340" stroke-width="22"/>
    <path d="M 440 350 C 480 260, 540 220, 600 190" stroke-width="14"/>
    <path d="M 520 330 C 580 400, 660 420, 740 430" stroke-width="12"/>
  </g>

  <!-- Dense Clouds of Flowering Sakura Blossoms -->
  <g fill="url(#g6Sakura)">
    <!-- Main Center Canopy Cloud -->
    <circle cx="360" cy="320" r="65" opacity="0.95"/>
    <circle cx="420" cy="280" r="75" opacity="0.95"/>
    <circle cx="480" cy="310" r="70" opacity="0.95"/>
    <circle cx="300" cy="360" r="60" opacity="0.95"/>

    <!-- Left Cloud -->
    <circle cx="160" cy="380" r="60" opacity="0.9"/>
    <circle cx="100" cy="320" r="55" opacity="0.9"/>
    <circle cx="70" cy="390" r="50" opacity="0.9"/>

    <!-- Right Clouds over Moon -->
    <circle cx="560" cy="240" r="65" opacity="0.92"/>
    <circle cx="640" cy="210" r="60" opacity="0.92"/>
    <circle cx="680" cy="310" r="70" opacity="0.9"/>
    <circle cx="740" cy="380" r="55" opacity="0.9"/>
    <circle cx="580" cy="360" r="60" opacity="0.9"/>
  </g>

  <!-- Detailed Individual 5-Petal Cherry Blossoms -->
  <g transform="translate(420, 260)">
    <circle cx="0" cy="0" r="8" fill="#FFF"/>
    <circle cx="0" cy="-14" r="10" fill="#FF85A2"/>
    <circle cx="13" cy="-5" r="10" fill="#FF85A2"/>
    <circle cx="8" cy="12" r="10" fill="#FF85A2"/>
    <circle cx="-8" cy="12" r="10" fill="#FF85A2"/>
    <circle cx="-13" cy="-5" r="10" fill="#FF85A2"/>
    <circle cx="0" cy="0" r="4" fill="#D4AF37"/>
  </g>

  <!-- Romantic Wooden Park Bench Beneath the Tree -->
  <g transform="translate(480, 780)">
    <!-- Bench Slats -->
    <rect x="-80" y="-30" width="160" height="8" rx="3" fill="#D4AF37"/>
    <rect x="-80" y="-18" width="160" height="8" rx="3" fill="#D4AF37"/>
    <rect x="-80" y="0" width="160" height="12" rx="4" fill="#D4AF37"/>
    <!-- Bench Legs -->
    <line x1="-65" y1="-30" x2="-65" y2="40" stroke="#1A0614" stroke-width="6"/>
    <line x1="65" y1="-30" x2="65" y2="40" stroke="#1A0614" stroke-width="6"/>
    <!-- Warm Lantern on Bench Glowing -->
    <rect x="-40" y="-14" width="14" height="18" rx="3" fill="#FFE885" stroke="#D4AF37" stroke-width="2"/>
    <circle cx="-33" cy="-5" r="18" fill="#FFE885" opacity="0.35"/>
  </g>

  <!-- Drifting Shower of Pink Sakura Petals Tumbling Through Air -->
  <g fill="#FFD1DC">
    <ellipse cx="250" cy="450" rx="8" ry="14" transform="rotate(25 250 450)"/>
    <ellipse cx="340" cy="520" rx="7" ry="12" transform="rotate(-35 340 520)"/>
    <ellipse cx="450" cy="480" rx="9" ry="15" transform="rotate(45 450 480)"/>
    <ellipse cx="520" cy="580" rx="8" ry="13" transform="rotate(-15 520 580)"/>
    <ellipse cx="390" cy="660" rx="7" ry="11" transform="rotate(60 390 660)"/>
    <ellipse cx="610" cy="620" rx="8" ry="14" transform="rotate(-50 610 620)"/>
    <ellipse cx="300" cy="720" rx="6" ry="10" transform="rotate(30 300 720)"/>
    <ellipse cx="580" cy="730" rx="7" ry="12" transform="rotate(-20 580 730)"/>
  </g>
</svg>