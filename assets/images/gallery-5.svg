<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="g5Sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="40%" stop-color="#FDE8E8"/>
      <stop offset="100%" stop-color="#F8C8DC"/>
    </linearGradient>
    <linearGradient id="g5Tea" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C68B59"/>
      <stop offset="50%" stop-color="#A2673B"/>
      <stop offset="100%" stop-color="#6E3B1E"/>
    </linearGradient>
    <linearGradient id="g5Cup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FFF2E8"/>
      <stop offset="100%" stop-color="#F5DAC1"/>
    </linearGradient>
    <linearGradient id="g5Gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7B4"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <filter id="g5Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#g5Sky)" rx="32"/>
  <rect x="24" y="24" width="752" height="952" rx="24" fill="none" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 6"/>

  <!-- Golden Morning Sun Rays Backdrop -->
  <circle cx="400" cy="460" r="260" fill="#FFF" fill-opacity="0.6"/>
  <circle cx="400" cy="460" r="210" fill="#FFE8D6" fill-opacity="0.45"/>

  <!-- Steaming Chai Art Group -->
  <g transform="translate(400, 500)" filter="url(#g5Glow)">
    <!-- Elegant Ceramic Saucer -->
    <ellipse cx="0" cy="140" rx="210" ry="36" fill="#E8D5C4" opacity="0.6"/>
    <ellipse cx="0" cy="130" rx="200" ry="32" fill="url(#g5Cup)" stroke="#D4AF37" stroke-width="2.5"/>
    <ellipse cx="0" cy="126" rx="145" ry="20" fill="#F0DFC8"/>

    <!-- Chai Cup Body -->
    <path d="M -125 0 C -120 95, -85 125, 0 125 C 85 125, 120 95, 125 0 Z" fill="url(#g5Cup)" stroke="#D4AF37" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="125" ry="28" fill="url(#g5Cup)" stroke="#D4AF37" stroke-width="2"/>

    <!-- Aromatic Cardamom Chai Liquid Surface -->
    <ellipse cx="0" cy="2" rx="114" ry="23" fill="url(#g5Tea)"/>
    <ellipse cx="-20" cy="0" rx="70" ry="12" fill="#DDB288" opacity="0.6"/>
    <ellipse cx="35" cy="5" rx="40" ry="8" fill="#8C532B" opacity="0.8"/>

    <!-- Cup Handle -->
    <path d="M 120 12 C 180 18, 180 95, 110 95" fill="none" stroke="url(#g5Gold)" stroke-width="16" stroke-linecap="round"/>
    <path d="M 120 12 C 170 18, 170 95, 110 95" fill="none" stroke="#FFF" stroke-width="6" stroke-linecap="round"/>

    <!-- Chai Cup Gold Floral Filigree -->
    <path d="M -70 55 Q 0 80 70 55" fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="70" r="6" fill="#E75480"/>
    <path d="M -18 70 Q -35 74 -45 66" fill="none" stroke="#A3B18A" stroke-width="2"/>
    <path d="M 18 70 Q 35 74 45 66" fill="none" stroke="#A3B18A" stroke-width="2"/>

    <!-- Rising Whimsical Warm Steam (Heart and floral curves) -->
    <g stroke="#E75480" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.75">
      <path d="M -50 -20 C -70 -70, -35 -120, -55 -180 C -70 -230, -45 -260, -55 -300" stroke-dasharray="180" stroke-dashoffset="10"/>
      <path d="M 0 -25 C 15 -80, -25 -130, 0 -190 C 20 -235, 35 -250, 20 -290" stroke-width="3.5"/>
      <!-- Heart shaped steam burst -->
      <path d="M 0 -240 C -25 -275, -60 -240, 0 -190 C 60 -240, 25 -275, 0 -240" fill="#F8C8DC" fill-opacity="0.35" stroke="#D4AF37" stroke-width="2.5"/>
      <path d="M 50 -20 C 70 -70, 35 -120, 55 -180 C 70 -230, 50 -260, 60 -300"/>
    </g>

    <!-- Surrounding Fresh Morning Jasmine & Roses at Base -->
    <g transform="translate(-160, 120) scale(0.8)">
      <circle cx="0" cy="0" r="32" fill="#E75480"/>
      <circle cx="-10" cy="-10" r="18" fill="#FFF"/>
      <circle cx="10" cy="-10" r="18" fill="#FFF"/>
      <circle cx="0" cy="12" r="18" fill="#FFF"/>
      <circle cx="0" cy="0" r="10" fill="#D4AF37"/>
    </g>
    <g transform="translate(150, 130) scale(0.9)">
      <circle cx="0" cy="0" r="35" fill="#E75480"/>
      <circle cx="-12" cy="-8" r="20" fill="#FFF"/>
      <circle cx="12" cy="-8" r="20" fill="#FFF"/>
      <circle cx="0" cy="14" r="20" fill="#FFF"/>
      <circle cx="0" cy="0" r="12" fill="#D4AF37"/>
    </g>
  </g>
</svg>