<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="g1Sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="40%" stop-color="#FDE8F0"/>
      <stop offset="100%" stop-color="#F8C8DC"/>
    </linearGradient>
    <linearGradient id="g1Gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CE"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <radialGradient id="g1SunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7DC" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FDE8F0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F8C8DC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g1Peony" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F8C8DC"/>
      <stop offset="75%" stop-color="#E75480"/>
      <stop offset="100%" stop-color="#A8325E"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#g1Sky)" rx="32"/>
  <rect x="24" y="24" width="752" height="952" rx="24" fill="none" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 6"/>

  <!-- Sun Rays & Glow -->
  <circle cx="400" cy="460" r="280" fill="url(#g1SunGlow)"/>
  <g stroke="#D4AF37" stroke-width="1.5" opacity="0.35" stroke-dasharray="12 12">
    <line x1="400" y1="180" x2="400" y2="100"/>
    <line x1="600" y1="260" x2="660" y2="200"/>
    <line x1="680" y1="460" x2="760" y2="460"/>
    <line x1="200" y1="260" x2="140" y2="200"/>
    <line x1="120" y1="460" x2="40" y2="460"/>
  </g>

  <!-- Radiant Smiling Profile Silhouette with Floral Hair -->
  <g transform="translate(400, 460)">
    <!-- Aura Circle -->
    <circle cx="0" cy="0" r="190" fill="#FFFFFF" fill-opacity="0.6" stroke="#D4AF37" stroke-width="2"/>

    <!-- Artistic Minimalist Face Silhouette -->
    <path d="M -30 -90 C 20 -90 60 -50 60 10 C 60 70 20 110 -30 110" fill="none" stroke="#A8325E" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Closed smiling joyful eye -->
    <path d="M 0 -20 Q 15 -35 30 -20" fill="none" stroke="#A8325E" stroke-width="3" stroke-linecap="round"/>
    <path d="M 8 -30 L 10 -36" stroke="#A8325E" stroke-width="2"/>
    <path d="M 18 -32 L 22 -37" stroke="#A8325E" stroke-width="2"/>
    <!-- Rosy blush -->
    <ellipse cx="25" cy="5" rx="20" ry="12" fill="#E75480" fill-opacity="0.3"/>
    <!-- Radiant curved smile -->
    <path d="M -5 35 Q 20 60 42 32" fill="none" stroke="#E75480" stroke-width="4" stroke-linecap="round"/>

    <!-- Lush Floral Hair Crown / Wreath -->
    <!-- Large Peony -->
    <g transform="translate(-50, -40) scale(1.1)">
      <circle cx="0" cy="0" r="45" fill="url(#g1Peony)" opacity="0.95"/>
      <circle cx="-12" cy="-12" r="28" fill="#FFF" opacity="0.5"/>
      <circle cx="12" cy="-12" r="28" fill="#FFF" opacity="0.5"/>
      <circle cx="0" cy="14" r="28" fill="#FFF" opacity="0.5"/>
      <circle cx="0" cy="0" r="14" fill="#D4AF37"/>
    </g>
    <!-- Second Peony -->
    <g transform="translate(-75, 45) scale(0.85)">
      <circle cx="0" cy="0" r="40" fill="url(#g1Peony)" opacity="0.95"/>
      <circle cx="0" cy="0" r="12" fill="#D4AF37"/>
    </g>
    <!-- Top Rosebud -->
    <g transform="translate(-25, -115) scale(0.75)">
      <circle cx="0" cy="0" r="32" fill="url(#g1Peony)"/>
      <circle cx="0" cy="0" r="10" fill="#D4AF37"/>
    </g>

    <!-- Flowing Sage Leaves -->
    <path d="M -110 -20 C -150 -60 -130 -10 -90 0 Z" fill="#A3B18A"/>
    <path d="M -120 70 C -160 50 -140 100 -95 80 Z" fill="#A3B18A"/>

    <!-- Golden Fluttering Butterfly -->
    <g transform="translate(100, -80) scale(0.9) rotate(15)">
      <path d="M 0 0 C 30 -35 50 -10 10 10 Z" fill="url(#g1Gold)"/>
      <path d="M 0 0 C -30 -35 -50 -10 -10 10 Z" fill="url(#g1Gold)"/>
      <path d="M 0 0 C 25 15 35 35 5 25 Z" fill="#E75480"/>
      <path d="M 0 0 C -25 15 -35 35 -5 25 Z" fill="#E75480"/>
      <line x1="0" y1="-15" x2="0" y2="25" stroke="#3D1F2E" stroke-width="2"/>
    </g>

    <!-- Sparkles -->
    <g fill="#D4AF37">
      <path d="M 120 20 Q 130 20 130 10 Q 130 20 140 20 Q 130 20 130 30 Q 130 20 120 20 Z"/>
      <path d="M 80 100 Q 86 100 86 94 Q 86 100 92 100 Q 86 100 86 106 Q 86 100 80 100 Z"/>
    </g>
  </g>
</svg>