<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="g2SunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6B2D5C"/>
      <stop offset="35%" stop-color="#C24D6F"/>
      <stop offset="65%" stop-color="#F29369"/>
      <stop offset="85%" stop-color="#FCD37A"/>
      <stop offset="100%" stop-color="#FFF4D0"/>
    </linearGradient>
    <radialGradient id="g2Sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFE885"/>
      <stop offset="70%" stop-color="#F5A25D"/>
      <stop offset="100%" stop-color="#F29369" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g2Ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A1938"/>
      <stop offset="100%" stop-color="#21081A"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#g2SunsetSky)" rx="32"/>
  <rect x="24" y="24" width="752" height="952" rx="24" fill="none" stroke="#FCD37A" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="8 6"/>

  <!-- Giant Golden Setting Sun -->
  <circle cx="400" cy="520" r="170" fill="url(#g2Sun)"/>
  <circle cx="400" cy="520" r="100" fill="#FFFDF0" opacity="0.95"/>

  <!-- Distant Mountain Ridges & Trees Silhouettes -->
  <path d="M 0 620 Q 200 580 400 610 T 800 590 L 800 1000 L 0 1000 Z" fill="#5A2246" opacity="0.8"/>
  <path d="M 0 660 Q 250 630 500 650 T 800 640 L 800 1000 L 0 1000 Z" fill="url(#g2Ground)"/>

  <!-- Romantic Winding Cobblestone Garden Path -->
  <path d="M 400 640 C 400 680, 360 750, 370 820 C 380 880, 310 930, 260 1000 L 540 1000 C 490 930, 440 880, 430 820 C 420 750, 410 680, 400 640 Z" fill="#D4AF37" fill-opacity="0.35"/>

  <!-- Couple Silhouette Walking Hand-in-Hand into Sunset -->
  <g transform="translate(400, 690) scale(1.15)">
    <!-- Husband Silhouette (Left) -->
    <circle cx="-16" cy="-80" r="9" fill="#1A0614"/>
    <path d="M -26 -68 C -26 -70, -6 -70, -6 -68 L -8 -15 L -24 -15 Z" fill="#1A0614"/>
    <line x1="-20" y1="-15" x2="-22" y2="35" stroke="#1A0614" stroke-width="7" stroke-linecap="round"/>
    <line x1="-12" y1="-15" x2="-10" y2="35" stroke="#1A0614" stroke-width="7" stroke-linecap="round"/>

    <!-- Wife Gull Bano Silhouette (Right) with Graceful Dress -->
    <circle cx="16" cy="-78" r="8.5" fill="#1A0614"/>
    <!-- Elegant flowing dress swaying into path -->
    <path d="M 8 -66 C 8 -68, 24 -68, 24 -66 L 36 20 C 36 25, -4 25, -4 20 L 8 -66 Z" fill="#1A0614"/>
    <line x1="12" y1="20" x2="10" y2="36" stroke="#1A0614" stroke-width="5" stroke-linecap="round"/>
    <line x1="22" y1="20" x2="24" y2="36" stroke="#1A0614" stroke-width="5" stroke-linecap="round"/>

    <!-- Entwined Hands in Center -->
    <path d="M -8 -45 Q 0 -35 8 -42" stroke="#1A0614" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="-38" r="3.5" fill="#FCD37A"/>
  </g>

  <!-- Golden Sunset Lanterns & Flora Along the Path -->
  <g fill="#FCD37A" opacity="0.85">
    <circle cx="280" cy="740" r="6"/>
    <circle cx="510" cy="760" r="6"/>
    <circle cx="230" cy="850" r="8"/>
    <circle cx="560" cy="870" r="8"/>
  </g>

  <!-- Floating Evening Petals -->
  <g fill="#FCD37A" opacity="0.6">
    <circle cx="200" cy="400" r="5"/>
    <circle cx="620" cy="450" r="6"/>
    <circle cx="320" cy="350" r="4"/>
    <circle cx="480" cy="320" r="5"/>
  </g>
</svg>